#             { name: 'Camera', value: event.camera_name }
#           ],
#           image: { url: `https://your-frigate.ts.net/api/events/...` }
#         }]
#       })
#     });
#   } else {
#     // Low confidence: send to Clawdbot for analysis
#     await fetch('http://localhost:18789/hooks/frigate', {
#       method: 'POST',
#       headers: {
#         'Content-Type': 'application/json',
#         'Authorization': 'Bearer TOKEN'
