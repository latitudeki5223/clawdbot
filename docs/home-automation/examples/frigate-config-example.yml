# });
#
# app.listen(9999, () => console.log('Forwarder listening on 9999'));
#
# Then in frigate notifications, point to: http://localhost:9999/frigate

# ============================================================================
# RECORDING & RETENTION
# ============================================================================
record:
  enabled: true
  retain:
    default: 7        # Keep 7 days of general recording
    motion: 14        # Keep 14 days if motion detected

# Database location
database:
  path: /mnt/frigate/frigate.db

# ============================================================================
# OPTIONAL: MQTT (Alternative Event Publishing)
# ============================================================================
# If using MQTT instead of webhooks, enable this:
#
# mqtt:
#   enabled: true
#   host: 192.168.1.50
#   port: 1883
#   topic_prefix: frigate
#
# Then subscribe with:
#   mosquitto_sub -h 192.168.1.50 -t "frigate/#"
#
# Route MQTT messages to Discord/Clawdbot with a separate forwarder.

# ============================================================================
# TESTING CHECKLIST
# ============================================================================
#
# 1. [ ] Verify Frigate can reach Discord webhook:
#        curl -X POST "https://discord.com/api/webhooks/..." \
#          -H 'Content-Type: application/json' \
#          -d '{"content":"Frigate test"}'
#
# 2. [ ] Verify Frigate can reach Clawdbot webhook:
#        curl -X POST "http://localhost:18789/hooks/frigate" \
#          -H 'Authorization: Bearer TOKEN' \
#          -d '{"test": "payload"}'
#
# 3. [ ] Verify snapshots are publicly accessible:
#        curl -I "https://your-machine-name.ts.net/api/events/ID/snapshot.jpg"
#        Should return 200 OK
#
# 4. [ ] Trigger a motion event and verify:
#        - High-confidence person appears in Discord channel
#        - Low-confidence appears in Clawdbot analysis channel
#
# 5. [ ] Check Frigate logs for any webhook errors:
#        docker logs frigate 2>&1 | grep -i webhook
#
# 6. [ ] Check Clawdbot logs for webhook receives:
#        tail -f ~/.clawdbot/gateway.log | grep hook
